services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: supervisor-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: supervisor_demo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 首次启动自动建 extension + documents 表
      - ./src/memory/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d supervisor_demo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
