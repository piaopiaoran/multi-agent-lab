# 一条命令拉起带 pgvector 扩展的 PostgreSQL：
#   docker compose up -d
# 本机没装 Docker 时也可用 brew：brew install postgresql@16 pgvector
# 然后手动执行：psql "$DATABASE_URL" -f db/schema.sql
services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: multi-agent-lab-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: multi_agent_lab
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d multi_agent_lab"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
